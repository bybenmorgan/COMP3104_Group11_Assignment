name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Confirm workflow is running
        run: echo "GitHub Actions is running for Group 11."

      - name: List repository files
        run: ls -la
